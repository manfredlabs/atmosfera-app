name: iosApp
options:
  bundleIdPrefix: com.manfredlabs.atmosfera
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: latest

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: TX7FM8785X
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manfredlabs.atmosfera
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework
        PROVISIONING_PROFILE_SPECIFIER: atmosfera
        CODE_SIGN_IDENTITY: "Apple Distribution"
        OTHER_LDFLAGS: $(inherited) -framework Shared -lsqlite3
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: "Atmosfera"
        CFBundleName: "Atmosfera"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchStoryboardName: ""
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "Atmosfera needs microphone access for tap tempo."
    sources:
      - path: iosApp
        excludes:
          - "Info.plist"
    resources:
      - path: iosApp/Assets.xcassets
      - path: iosApp/Resources
        optional: true
    dependencies:
      - framework: ../shared/build/bin/iosArm64/releaseFramework/Shared.framework
        embed: false
    preBuildScripts:
      - name: Build KMP Shared Framework
        script: |
          cd "$SRCROOT/.."
          export JAVA_HOME=$(/usr/libexec/java_home -v 17 2>/dev/null || /usr/libexec/java_home)
          chmod +x gradlew
          ./gradlew :shared:linkReleaseFrameworkIosArm64
        basedOnDependencyAnalysis: false
