workflows:
  android-release:
    name: Android Release Build
    instance_type: linux_x2
    environment:
      java: 17
      groups:
        - android_credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Build Android release
        script: |
          ./gradlew :app:bundleRelease \
            -PversionCode=$BUILD_NUMBER
      - name: Sign AAB
        script: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore keystore.jks \
            -storepass $KEYSTORE_PASSWORD \
            -keypass $KEY_PASSWORD \
            app/build/outputs/bundle/release/app-release.aab \
            $KEY_ALIAS
    artifacts:
      - app/build/outputs/bundle/release/app-release.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m2
    environment:
      java: 17
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        provisioning_profiles:
          - atmosfera
        certificates:
          - atmosfera-ios
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Set up code signing
        script: |
          xcode-project use-profiles \
            --project iosApp/iosApp.xcodeproj
      - name: Build KMP shared framework
        script: |
          ./gradlew :shared:assembleXCFramework
      - name: Install xcodegen
        script: |
          brew install xcodegen || true
      - name: Generate Xcode project
        script: |
          cd iosApp && xcodegen generate
      - name: Build iOS archive
        script: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/iosApp.xcarchive \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            archive
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/iosApp.xcarchive \
            -exportPath $CM_BUILD_DIR/ios/ipa \
            -exportOptionsPlist iosApp/ExportOptions.plist
    artifacts:
      - $CM_BUILD_DIR/ios/ipa/**/*.ipa
      - $CM_BUILD_DIR/iosApp.xcarchive
    publishing:
      app_store_connect:
        key_id: 66688K36LJ
        issuer_id: 7efa127e-f0c6-44cd-8636-19080f38a227
        api_key: $APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY
        submit_to_testflight: true
