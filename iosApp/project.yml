name: iosApp
options:
  bundleIdPrefix: com.manfredlabs.atmosfera
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: latest

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: "Atmosfera"
        CFBundleName: "Atmosfera"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchStoryboardName: ""
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "Atmosfera needs microphone access for tap tempo."
    sources:
      - path: iosApp
        excludes:
          - "Info.plist"
    resources:
      - path: iosApp/Assets.xcassets
      - path: iosApp/Resources
        optional: true
    dependencies:
      - framework: ../shared/build/XCFrameworks/release/Shared.xcframework
        embed: false
    preBuildScripts:
      - name: Build KMP Shared Framework
        script: |
          cd "$SRCROOT/.."
          export JAVA_HOME=$(/usr/libexec/java_home -v 17 2>/dev/null || /usr/libexec/java_home)
          ./gradlew :shared:assembleXCFramework
        basedOnDependencyAnalysis: false
    settings:
      base:
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../shared/build/XCFrameworks/release/Shared.xcframework
